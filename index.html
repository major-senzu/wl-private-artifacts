<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Protected</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#1a1d24; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; }
  .lock { background:#242832; border:1px solid #3a4150; border-radius:12px; padding:40px 36px;
          max-width:360px; width:calc(100% - 48px); text-align:center; color:#e6e9ef; }
  .lock-icon { font-size:34px; margin-bottom:14px; }
  .lock p { margin:0 0 20px; font-size:14px; color:#aab2c0; line-height:1.7; }
  .row { display:flex; gap:8px; }
  input { flex:1; padding:10px 12px; border-radius:8px; border:1px solid #3a4150;
          background:#1a1d24; color:#e6e9ef; font-size:14px; outline:none; }
  input:focus { border-color:#5b8def; }
  button { padding:10px 18px; border:none; border-radius:8px; background:#5b8def; color:#fff;
           font-size:14px; cursor:pointer; }
  button:hover { background:#4a7de0; }
  .err { color:#ff7a7a; font-size:12px; margin-top:12px; min-height:16px; }
</style>
</head>
<body>
<div class="lock">
  <div class="lock-icon">&#128274;</div>
  <p>このページはパスワードで保護されています。</p>
  <div class="row">
    <input type="password" id="pw" placeholder="パスワード" autofocus
           onkeydown="if(event.key==='Enter'){unlock();}">
    <button onclick="unlock()">表示</button>
  </div>
  <div class="err" id="err"></div>
</div>

<script>
async function unlock() {
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const meta = JSON.parse(document.getElementById('enc').textContent);
    const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    const pw = document.getElementById('pw').value;
    const keyMaterial = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(meta.s), iterations: 200000, hash: 'SHA-256' },
      keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(meta.i) }, key, b64(meta.d));
    const htmlText = new TextDecoder().decode(plain);
    document.open();
    document.write(htmlText);
    document.close();
  } catch (e) {
    err.textContent = 'パスワードが違います';
  }
}
</script>
